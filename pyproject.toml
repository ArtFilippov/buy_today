[project]
name = "buy_today"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ArtFilippov", email = "artfilipp0w@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29",
    "joblib>=1.4",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.10.0",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "numpy>=2.1.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.6.0",
    "scipy>=1.14.1",
    "threadpoolctl>=3.1",
]

[project.scripts]
buy_today = "buy_today.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
